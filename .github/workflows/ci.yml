name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Public repository safety
        run: node scripts/audit-public-repo-safety.js .
      - name: Build reproducibility policy
        run: bun run audit:reproducibility --root . --policy config/build-reproducibility-policy.json
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - if: github.event_name == 'pull_request'
        env:
          LINT_CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run lint:changed
      - run: bun run build
      # `check` composes typecheck, test, and lint, so rerunning it here would be redundant.
