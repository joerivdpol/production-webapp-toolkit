name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install and verify sandbox runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --die-with-parent --new-session --unshare-all --hostname agent-sandbox --cap-drop ALL \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev \
            --tmpfs /tmp --dir /runtime --ro-bind "$RUNNER_TEMP" /workspace --chdir /workspace \
            --clearenv --setenv PATH /usr/bin:/bin --setenv HOME /nonexistent --setenv TMPDIR /tmp --setenv LANG C.UTF-8 \
            -- /usr/bin/prlimit --cpu=2 --as=536870912 --fsize=1048576 --nofile=64 --nproc=16 -- /bin/sh -c 'printf sandbox-ci-smoke'

      - name: Public repository safety
        run: node scripts/audit-public-repo-safety.js .
      - name: Build reproducibility policy
        run: bun run audit:reproducibility --root . --policy config/build-reproducibility-policy.json
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - if: github.event_name == 'pull_request'
        env:
          LINT_CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run lint:changed
      - run: bun run build
      # `check` composes typecheck, test, and lint, so rerunning it here would be redundant.
