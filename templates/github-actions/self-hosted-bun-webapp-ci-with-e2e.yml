name: Self-hosted web application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

env:
  E2E_PORT: "43174" # ADAPT: reserve one unique port per repository.

jobs:
  quality:
    runs-on: [self-hosted, linux, x64, ubuntu-dev, trusted-ci]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out Production Webapp Toolkit
        uses: actions/checkout@v7
        with:
          repository: joerivdpol/production-webapp-toolkit
          ref: v2.4.0
          path: .toolkit/production-webapp-toolkit
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Run local-parity quality gates
        env:
          LINT_CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(.)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--changed-base "$LINT_CHANGED_BASE")
          fi
          node .toolkit/production-webapp-toolkit/scripts/ci-local.js "${args[@]}" --full-lint advisory

  e2e:
    needs: quality
    runs-on: [self-hosted, linux, x64, ubuntu-dev, trusted-ci]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out Production Webapp Toolkit
        uses: actions/checkout@v7
        with:
          repository: joerivdpol/production-webapp-toolkit
          ref: v2.4.0
          path: .toolkit/production-webapp-toolkit
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Clear stale reserved E2E port
        run: node .toolkit/production-webapp-toolkit/scripts/ci-port-guard.js --port "$E2E_PORT" --cleanup

      - name: Run blocking Chromium E2E
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:${{ env.E2E_PORT }}
        run: |
          set +e
          bun run test:e2e --project=chromium 2>&1 | tee /tmp/ci-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            node .toolkit/production-webapp-toolkit/scripts/ci-failure-classifier.js               --step e2e --output-file /tmp/ci-e2e.log
            exit "$status"
          fi

      - name: Clean reserved E2E port
        if: always()
        run: node .toolkit/production-webapp-toolkit/scripts/ci-port-guard.js --port "$E2E_PORT" --cleanup --force

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
